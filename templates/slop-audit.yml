name: "Slop AI Audit"

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit:
    name: "Anti-Slop & Quality Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run slop-lint Audit
        run: |
          npx --yes slop-ai-indo lint . --tier=hard-gate
